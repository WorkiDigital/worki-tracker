<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worki Tracker — Dashboard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-2: #1a1a26;
      --surface-3: #222233;
      --border: #2a2a3d;
      --text: #e8e8f0;
      --text-2: #9898b0;
      --text-3: #686880;
      --accent: #00d4aa;
      --accent-2: #00b894;
      --accent-glow: rgba(0, 212, 170, 0.15);
      --warning: #ffa726;
      --danger: #ef5350;
      --info: #42a5f5;
      --purple: #ab47bc;
      --instagram: #e1306c;
      --meta: #1877f2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .topbar h1 {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      color: var(--accent);
    }

    .topbar .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-3);
    }

    .topbar .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
    }

    .stat-card:nth-child(1)::after {
      background: var(--accent);
    }

    .stat-card:nth-child(2)::after {
      background: var(--info);
    }

    .stat-card:nth-child(3)::after {
      background: var(--warning);
    }

    .stat-card:nth-child(4)::after {
      background: var(--purple);
    }

    .stat-card:nth-child(5)::after {
      background: var(--instagram);
    }

    .stat-card:nth-child(6)::after {
      background: var(--meta);
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-3);
      margin-bottom: 6px;
    }

    .stat-value {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
    }

    .stat-card:nth-child(1) .stat-value {
      color: var(--accent);
    }

    .stat-card:nth-child(2) .stat-value {
      color: var(--info);
    }

    .stat-card:nth-child(3) .stat-value {
      color: var(--warning);
    }

    .stat-card:nth-child(4) .stat-value {
      color: var(--purple);
    }

    .stat-card:nth-child(5) .stat-value {
      color: var(--instagram);
    }

    .stat-card:nth-child(6) .stat-value {
      color: var(--meta);
    }

    .stat-sub {
      font-size: 10px;
      color: var(--text-3);
      margin-top: 4px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .panel-header h2 {
      font-size: 15px;
      font-weight: 600;
    }

    .filters {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-3);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--text-3);
      color: var(--text-2);
    }

    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }

    .search-input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      width: 220px;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-input::placeholder {
      color: var(--text-3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-3);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      color: var(--text-2);
    }

    tr {
      cursor: pointer;
      transition: background 0.15s;
    }

    tr:hover td {
      background: var(--surface-2);
    }

    .lead-name {
      font-weight: 600;
      color: var(--text);
    }

    .lead-sub {
      color: var(--text-3);
      font-size: 11px;
    }

    .lead-ig {
      color: var(--instagram);
      font-size: 11px;
      font-weight: 500;
    }

    .source-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .src-instagram {
      background: rgba(225, 48, 108, 0.15);
      color: var(--instagram);
    }

    .src-facebook {
      background: rgba(24, 119, 242, 0.15);
      color: var(--meta);
    }

    .src-google {
      background: rgba(66, 165, 245, 0.15);
      color: var(--info);
    }

    .src-direct {
      background: rgba(0, 212, 170, 0.15);
      color: var(--accent);
    }

    .src-whatsapp {
      background: rgba(76, 175, 80, 0.15);
      color: #4caf50;
    }

    .src-other {
      background: rgba(255, 167, 38, 0.15);
      color: var(--warning);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .st-converted .status-dot {
      background: var(--accent);
    }

    .st-converted {
      color: var(--accent);
    }

    .st-identified .status-dot {
      background: var(--info);
    }

    .st-identified {
      color: var(--info);
    }

    .st-returning .status-dot {
      background: var(--warning);
    }

    .st-returning {
      color: var(--warning);
    }

    .st-visiting .status-dot {
      background: var(--text-3);
    }

    .st-visiting {
      color: var(--text-3);
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .meta-badge.has-meta {
      background: rgba(24, 119, 242, 0.15);
      color: var(--meta);
    }

    .meta-badge.no-meta {
      background: rgba(104, 104, 128, 0.1);
      color: var(--text-3);
    }

    /* Journey Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 800px;
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0
      }

      to {
        transform: translateY(0);
        opacity: 1
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 16px;
    }

    .modal-close {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-3);
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
    }

    .modal-body {
      padding: 24px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .lead-info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .info-box {
      background: var(--surface-2);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .info-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-3);
      margin-bottom: 3px;
    }

    .info-value {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--text);
      word-break: break-all;
    }

    .info-value.ig {
      color: var(--instagram);
    }

    .info-value.meta-link {
      color: var(--meta);
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 16px 0 10px;
    }

    .timeline {
      position: relative;
      padding-left: 28px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 9px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .tl-item {
      position: relative;
      margin-bottom: 16px;
    }

    .tl-dot {
      position: absolute;
      left: -24px;
      top: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid;
      background: var(--bg);
    }

    .tl-pageview .tl-dot {
      border-color: var(--info);
    }

    .tl-click .tl-dot {
      border-color: var(--accent);
    }

    .tl-scroll .tl-dot {
      border-color: var(--text-3);
    }

    .tl-form_submit .tl-dot,
    .tl-identify .tl-dot {
      border-color: var(--purple);
    }

    .tl-conversion .tl-dot {
      border-color: var(--accent);
      background: var(--accent);
    }

    .tl-whatsapp_contact .tl-dot {
      border-color: #4caf50;
      background: #4caf50;
    }

    .tl-page_exit .tl-dot {
      border-color: var(--danger);
    }

    .tl-heartbeat .tl-dot {
      border-color: var(--text-3);
      opacity: 0.5;
    }

    .tl-content {
      background: var(--surface-2);
      border-radius: 8px;
      padding: 12px 14px;
      border: 1px solid var(--border);
    }

    .tl-time {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--text-3);
      margin-bottom: 3px;
    }

    .tl-event {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .tl-detail {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-3);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-3);
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .page-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-3);
      font-size: 12px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    .page-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .page-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    @media(max-width:1100px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media(max-width:900px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .lead-info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .filters {
        flex-wrap: wrap;
      }
    }

    @media(max-width:600px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 12px;
      }

      .lead-info-grid {
        grid-template-columns: 1fr;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--surface);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <h1>// WORKI TRACKER v2.0</h1>
    <div class="status">
      <div class="dot-live"></div> Live Tracking
    </div>
  </div>

  <div class="container">
    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Visitantes</div>
        <div class="stat-value" id="s-visitors">—</div>
        <div class="stat-sub" id="s-visitors-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Identificados</div>
        <div class="stat-value" id="s-identified">—</div>
        <div class="stat-sub" id="s-identified-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Conversões</div>
        <div class="stat-value" id="s-conversions">—</div>
        <div class="stat-sub" id="s-conversions-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Receita Total</div>
        <div class="stat-value" id="s-revenue">—</div>
        <div class="stat-sub" id="s-revenue-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Com Instagram</div>
        <div class="stat-value" id="s-instagram">—</div>
        <div class="stat-sub" id="s-instagram-sub">leads com @</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Via Meta Ads</div>
        <div class="stat-value" id="s-meta">—</div>
        <div class="stat-sub" id="s-meta-sub">com fbclid</div>
      </div>
    </div>

    <!-- Leads Table -->
    <div class="panel">
      <div class="panel-header">
        <h2>Leads</h2>
        <div class="filters">
          <button class="filter-btn active" data-status="all" onclick="filterStatus(this)">Todos</button>
          <button class="filter-btn" data-status="visiting" onclick="filterStatus(this)">Visitando</button>
          <button class="filter-btn" data-status="identified" onclick="filterStatus(this)">Identificados</button>
          <button class="filter-btn" data-status="converted" onclick="filterStatus(this)">Convertidos</button>
          <input type="text" class="search-input" placeholder="Buscar nome, email, @instagram..."
            oninput="searchLeads(this.value)">
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Lead</th>
            <th>Contato</th>
            <th>Origem</th>
            <th>Meta</th>
            <th>Páginas</th>
            <th>WhatsApp</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="leads-body">
          <tr>
            <td colspan="7" class="loading">Carregando...</td>
          </tr>
        </tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- Journey Modal -->
  <div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Jornada do Lead</h2>
        <button class="modal-close" onclick="closeModal()">✕ Fechar</button>
      </div>
      <div class="modal-body" id="modal-body">
        <div class="loading">Carregando...</div>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════
    // CONFIG
    // ═══════════════════════════════════════
    const API_BASE = window.location.origin + '/api/dashboard';
    const API_KEY = prompt('Digite sua API Key:') || '';

    const headers = { 'X-API-Key': API_KEY, 'Content-Type': 'application/json' };

    let currentPage = 1;
    let currentStatus = 'all';
    let searchQuery = '';
    let searchTimeout = null;

    // ═══════════════════════════════════════
    // FETCH HELPERS
    // ═══════════════════════════════════════
    async function api(path) {
      const res = await fetch(API_BASE + path, { headers });
      if (!res.ok) throw new Error(`API Error: ${res.status}`);
      return res.json();
    }

    // ═══════════════════════════════════════
    // LOAD STATS
    // ═══════════════════════════════════════
    async function loadStats() {
      try {
        const s = await api('/stats');
        document.getElementById('s-visitors').textContent = Number(s.total_visitors).toLocaleString('pt-BR');
        document.getElementById('s-visitors-sub').textContent = `${s.active_7d} ativos (7d)`;
        document.getElementById('s-identified').textContent = Number(s.identified_leads).toLocaleString('pt-BR');
        document.getElementById('s-identified-sub').textContent = `${s.whatsapp_contacts} via WhatsApp`;
        document.getElementById('s-conversions').textContent = Number(s.conversions).toLocaleString('pt-BR');
        document.getElementById('s-conversions-sub').textContent = `${s.conversion_rate || 0}% taxa`;
        document.getElementById('s-revenue').textContent = 'R$ ' + Number(s.total_revenue).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        document.getElementById('s-revenue-sub').textContent = `Média ${s.avg_days_to_convert || '—'} dias p/ converter`;
        document.getElementById('s-instagram').textContent = Number(s.with_instagram || 0).toLocaleString('pt-BR');
        document.getElementById('s-meta').textContent = Number(s.from_meta_ads || 0).toLocaleString('pt-BR');
      } catch (e) { console.error('Stats error:', e); }
    }

    // ═══════════════════════════════════════
    // LOAD LEADS
    // ═══════════════════════════════════════
    async function loadLeads() {
      try {
        const params = new URLSearchParams({
          page: currentPage, limit: 25,
          ...(currentStatus !== 'all' && { status: currentStatus }),
          ...(searchQuery && { search: searchQuery })
        });
        const data = await api('/leads?' + params);
        renderLeads(data.leads);
        renderPagination(data.total, data.page, data.limit);
      } catch (e) {
        document.getElementById('leads-body').innerHTML = '<tr><td colspan="7" class="empty-state">Erro ao carregar. Verifique a API Key.</td></tr>';
      }
    }

    function renderLeads(leads) {
      const tbody = document.getElementById('leads-body');
      if (!leads.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Nenhum lead encontrado</td></tr>';
        return;
      }

      tbody.innerHTML = leads.map(l => {
        const srcClass = getSourceClass(l.first_utm_source);
        const srcLabel = l.first_utm_source || 'direto';
        const stClass = 'st-' + (l.status || 'visiting');
        const stLabel = { converted: 'Converteu', identified: 'Identificado', returning: 'Retornando', visiting: 'Visitando' }[l.status] || l.status;
        const name = l.name || l.visitor_id.substring(0, 16) + '...';

        // Contato: email + instagram na mesma célula
        let contactHtml = '';
        if (l.email) contactHtml += `<span class="lead-sub">${esc(l.email)}</span>`;
        if (l.instagram) contactHtml += `<br><span class="lead-ig">${esc(l.instagram)}</span>`;
        if (!l.email && !l.instagram && l.phone) contactHtml += `<span class="lead-sub">${esc(l.phone)}</span>`;
        if (!contactHtml) contactHtml = '<span class="lead-sub">—</span>';

        // Sub info do lead
        const sub = l.phone || l.device_type || '';

        // Meta badge
        const hasMeta = l.fbclid || l.fbc;
        const metaHtml = hasMeta
          ? '<span class="meta-badge has-meta">● Meta</span>'
          : '<span class="meta-badge no-meta">—</span>';

        return `<tr onclick="openJourney('${l.visitor_id}')">
      <td><span class="lead-name">${esc(name)}</span><br><span class="lead-sub">${esc(sub)}</span></td>
      <td>${contactHtml}</td>
      <td><span class="source-tag ${srcClass}">${esc(srcLabel)}</span></td>
      <td>${metaHtml}</td>
      <td>${l.total_pageviews || 0}</td>
      <td>${l.whatsapp_contacted ? '✅' : '—'}</td>
      <td><span class="status-badge ${stClass}"><span class="status-dot"></span>${stLabel}</span></td>
    </tr>`;
      }).join('');
    }

    function renderPagination(total, page, limit) {
      const pages = Math.ceil(total / limit);
      const el = document.getElementById('pagination');
      if (pages <= 1) { el.innerHTML = ''; return; }

      let html = '';
      for (let i = 1; i <= Math.min(pages, 10); i++) {
        html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      el.innerHTML = html;
    }

    // ═══════════════════════════════════════
    // JOURNEY MODAL
    // ═══════════════════════════════════════
    async function openJourney(visitorId) {
      document.getElementById('modal').classList.add('open');
      document.getElementById('modal-body').innerHTML = '<div class="loading">Carregando jornada...</div>';

      try {
        const j = await api('/leads/' + encodeURIComponent(visitorId) + '/journey');
        const v = j.visitor;

        document.getElementById('modal-title').textContent = v.name || v.visitor_id;

        let html = `<div class="lead-info-grid">
      <div class="info-box"><div class="info-label">Telefone</div><div class="info-value">${v.phone || '—'}</div></div>
      <div class="info-box"><div class="info-label">Email</div><div class="info-value">${v.email || '—'}</div></div>
      <div class="info-box"><div class="info-label">Instagram</div><div class="info-value ig">${v.instagram || '—'}</div></div>
      <div class="info-box"><div class="info-label">Empresa</div><div class="info-value">${v.empresa || '—'}</div></div>
      <div class="info-box"><div class="info-label">Origem</div><div class="info-value">${v.first_utm_source || 'direto'}</div></div>
      <div class="info-box"><div class="info-label">Campanha</div><div class="info-value">${v.first_utm_campaign || '—'}</div></div>
      <div class="info-box"><div class="info-label">Visitas</div><div class="info-value">${v.total_visits}</div></div>
      <div class="info-box"><div class="info-label">Conversão</div><div class="info-value">${v.converted ? 'R$ ' + Number(v.conversion_value).toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : '—'}</div></div>
    </div>`;

        // Meta Ads Section (só mostra se tem dados)
        if (v.fbclid || v.fbc || v.fbp) {
          html += '<div class="section-title">🔗 Meta Ads Tracking</div>';
          html += '<div class="lead-info-grid">';
          if (v.fbclid) html += `<div class="info-box"><div class="info-label">FBCLID</div><div class="info-value meta-link">${v.fbclid.substring(0, 30)}...</div></div>`;
          if (v.fbc) html += `<div class="info-box"><div class="info-label">FBC (Click ID)</div><div class="info-value meta-link">${v.fbc.substring(0, 30)}...</div></div>`;
          if (v.fbp) html += `<div class="info-box"><div class="info-label">FBP (Browser ID)</div><div class="info-value meta-link">${v.fbp}</div></div>`;
          if (v.client_ip) html += `<div class="info-box"><div class="info-label">IP</div><div class="info-value">${v.client_ip}</div></div>`;
          html += '</div>';
        }

        // Localização (só mostra se tem)
        if (v.city || v.state || v.country || v.zip_code || v.client_ip) {
          html += '<div class="section-title">📍 Localização e IP</div>';
          html += '<div class="lead-info-grid">';
          if (v.client_ip) html += `<div class="info-box"><div class="info-label">IP</div><div class="info-value">${v.client_ip}</div></div>`;
          if (v.city) html += `<div class="info-box"><div class="info-label">Cidade</div><div class="info-value">${v.city}</div></div>`;
          if (v.state) html += `<div class="info-box"><div class="info-label">Estado</div><div class="info-value">${v.state}</div></div>`;
          if (v.zip_code) html += `<div class="info-box"><div class="info-label">CEP</div><div class="info-value">${v.zip_code}</div></div>`;
          if (v.country) html += `<div class="info-box"><div class="info-label">País</div><div class="info-value">${v.country}</div></div>`;
          html += '</div>';
        }

        // Device
        html += '<div class="section-title">📱 Dispositivo</div>';
        html += `<div class="lead-info-grid">
      <div class="info-box"><div class="info-label">Tipo</div><div class="info-value">${v.device_type || '—'}</div></div>
      <div class="info-box"><div class="info-label">OS</div><div class="info-value">${v.device_os || '—'}</div></div>
      <div class="info-box"><div class="info-label">Browser</div><div class="info-value">${v.device_browser || '—'}</div></div>
      <div class="info-box"><div class="info-label">Tela</div><div class="info-value">${v.device_screen || '—'}</div></div>
    </div>`;

        // Timeline
        html += '<div class="section-title">📋 Timeline</div>';
        const events = j.events.filter(e => e.event_type !== 'heartbeat');
        html += '<div class="timeline">';
        events.forEach(e => {
          const d = typeof e.data === 'string' ? JSON.parse(e.data) : (e.data || {});
          const time = new Date(e.created_at).toLocaleString('pt-BR');
          const { label, detail } = formatEvent(e.event_type, d, e.page);

          html += `<div class="tl-item tl-${e.event_type}">
        <div class="tl-dot"></div>
        <div class="tl-content">
          <div class="tl-time">${time}</div>
          <div class="tl-event">${label}</div>
          ${detail ? `<div class="tl-detail">${detail}</div>` : ''}
        </div>
      </div>`;
        });
        html += '</div>';

        document.getElementById('modal-body').innerHTML = html;
      } catch (e) {
        document.getElementById('modal-body').innerHTML = '<div class="empty-state">Erro ao carregar jornada</div>';
      }
    }

    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    function formatEvent(type, data, page) {
      switch (type) {
        case 'pageview':
          return { label: `Visitou ${page || '/'}`, detail: data.utm?.source ? `Via ${data.utm.source}` + (data.utm.campaign ? ` (${data.utm.campaign})` : '') : data.referrer ? `Referrer: ${data.referrer}` : 'Tráfego direto' };
        case 'click':
          if (data.type === 'whatsapp_click') return { label: '📱 Clicou no WhatsApp', detail: `Número: ${data.phone || '—'}` };
          if (data.type === 'phone_click') return { label: '📞 Clicou no telefone', detail: data.phone };
          return { label: `Clicou: ${data.text || data.id || data.tag}`, detail: data.href || '' };
        case 'scroll': return { label: `Scroll ${data.depth}`, detail: '' };
        case 'form_submit':
          const fields = Object.entries(data.fields || {}).map(([k, v]) => `${k}: ${v}`).join(', ');
          return { label: '📝 Enviou formulário', detail: fields };
        case 'identify':
          return { label: '🏷️ Identificado', detail: `${data.name || ''} ${data.email || ''} ${data.phone || ''} ${data.instagram || ''}`.trim() };
        case 'conversion': return { label: `🎯 CONVERSÃO${data.source ? ' — via ' + data.source : ''}`, detail: data.value ? `R$ ${Number(data.value).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}` + (data.product ? ` — ${data.product}` : '') : '' };
        case 'whatsapp_contact':
          let waDetail = `${data.pushName || ''}: "${(data.message || '').substring(0, 80)}"`;
          if (data.ctwaClid) waDetail += ' 🔗 Meta Ad';
          return { label: '💬 Contato via WhatsApp', detail: waDetail };
        case 'page_exit': return { label: '🚪 Saiu da página', detail: `Tempo: ${data.time_on_page || 0}s` };
        case 'exit_intent': return { label: '⚠️ Intenção de saída', detail: '' };
        case 'visibility': return { label: data.state === 'hidden' ? '👁️ Trocou de aba' : '👁️ Voltou à aba', detail: '' };
        default: return { label: type, detail: JSON.stringify(data).substring(0, 100) };
      }
    }

    // ═══════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════
    function getSourceClass(src) {
      if (!src) return 'src-direct';
      const s = src.toLowerCase();
      if (s.includes('instagram')) return 'src-instagram';
      if (s.includes('facebook') || s.includes('meta') || s.includes('fb')) return 'src-facebook';
      if (s.includes('google')) return 'src-google';
      if (s.includes('whatsapp')) return 'src-whatsapp';
      return 'src-other';
    }

    function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    function filterStatus(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStatus = btn.dataset.status;
      currentPage = 1;
      loadLeads();
    }

    function searchLeads(q) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => { searchQuery = q; currentPage = 1; loadLeads(); }, 300);
    }

    function goPage(p) { currentPage = p; loadLeads(); }

    // ═══════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════
    loadStats();
    loadLeads();
    setInterval(loadStats, 30000);
  </script>
</body>

</html>
